<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padelnesia is now Padelkultura</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Pengaturan Warna Utama */
        :root {
            --primary-text: #ffffff;
            --accent-gold: #d4af37; 
            --bg-dark: #121212; 
            --text-muted: #a0a0a0;
        }

        /* Reset & Pengaturan Dasar */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--primary-text);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Wadah Utama */
        .container {
            max-width: 650px;
            padding: 40px 20px;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* Area Logo/Nama Brand */
        .brand-transition {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            font-family: 'Playfair Display', serif;
        }

        .old-brand {
            color: var(--text-muted);
            text-decoration: line-through;
            font-size: 1.4rem;
        }

        .new-brand {
            color: var(--accent-gold);
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .arrow {
            color: var(--primary-text);
            font-size: 1.5rem;
        }

        /* Teks Konten */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-weight: 400;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .redirect-text {
            font-size: 0.95rem;
            margin-bottom: 40px;
            color: #777;
        }

        .countdown-number {
            color: var(--primary-text);
            font-weight: 600;
        }

        /* Tombol Call to Action */
        .btn {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-gold);
            text-decoration: none;
            padding: 16px 36px;
            border: 1px solid var(--accent-gold);
            border-radius: 4px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s ease;
        }

        .btn:hover {
            background-color: var(--accent-gold);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* Animasi Masuk */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsif untuk Layar HP */
        @media (max-width: 768px) {
            h1 { 
                font-size: 2.5rem; 
            }
            .brand-transition { 
                flex-direction: column; 
                gap: 5px; 
            }
            .arrow { 
                transform: rotate(90deg); 
                margin: 10px 0; 
            }
            .new-brand {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-transition">
            <span class="old-brand">Padelnesia</span>
            <span class="arrow">→</span>
            <span class="new-brand">Padelkultura</span>
        </div>

        <h1>A New Era Begins</h1>
        <p>We have evolved. Padelnesia has officially transformed into <strong>Padelkultura</strong>, bringing you an elevated and refined padel Builder Experience.</p>
        
        <p class="redirect-text">You will be automatically redirected to our new home in <span id="countdown" class="countdown-number">10</span> seconds.</p>
        
        <a href="https://padelkultura.id" class="btn">Discover Padelkultura</a>
    </div>

    <script>
        // Ubah URL di bawah ini dengan alamat website Padelkultura yang sebenarnya
        const targetURL = "https://padelkultura.id"; 
        let timeLeft = 10; // Waktu hitung mundur dalam detik
        
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                // Baris di bawah ini yang akan memindahkan pengunjung secara otomatis
                window.location.href = targetURL; 
            }
        }, 1000);
    </script>

</body>
</html>
